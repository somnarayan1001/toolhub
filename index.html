<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolhub</title>
<meta name="description" content="Toolhub: a growing collection of free, useful online tools.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236252ea'/%3E%3Cpath d='M9 10h14M16 10v13' stroke='%23fff' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0a0c16; --surface: #11142a; --line: #232846; --fg: #eef0fb; --muted: #959cbb; --accent: #a99dff;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f4f5fb; --surface: #ffffff; --line: #e1e3f0; --fg: #12142b; --muted: #5c6283; --accent: #5444dc; color-scheme: light; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
main { max-width: 800px; margin: 0 auto; padding: 56px 16px; }
h1 { margin: 0; font-size: clamp(34px, 7vw, 48px); line-height: 1.1; letter-spacing: -.02em; }
.sub { margin: 12px 0 36px; color: var(--muted); font-size: 18px; }
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; list-style: none; margin: 0; padding: 0; }
.tool { display: block; height: 100%; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; color: inherit; text-decoration: none; transition: border-color .15s; }
.tool:hover { border-color: var(--accent); }
.tool:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tool b { display: block; font-size: 20px; }
.tool span { display: block; margin-top: 4px; color: var(--muted); font-size: 15px; }
.tool em { display: block; margin-top: 12px; color: var(--accent); font-size: 14px; font-style: normal; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .tool { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Toolhub</h1>
  <p class="sub">A growing collection of free, useful online tools.</p>
  <ul class="tools">
    <li><a class="tool" href="https://somnarayan1001.github.io/docura/"><b>Docura</b><span>PDF and image tools that run in your browser. Your files never leave your device.</span><em>Open Docura →</em></a></li>
  </ul>
</main>
</body>
</html>
